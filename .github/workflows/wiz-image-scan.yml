name: Wiz CLI container-image scan

on:
  workflow_call:
    inputs:
      image:
        description: Container image name/tag/digest or path to an image archive.
        required: true
        type: string
      tag_image:
        description: Add the image digest to the Wiz Trusted Image Database after a successful scan.
        required: false
        type: boolean
        default: false
      image_digest:
        description: Optional image digest for wizcli tag, required for image archives and when the digest cannot be resolved locally.
        required: false
        type: string
        default: ""
      scan_types:
        description: Comma-separated list of vulnerabilities, secrets, sensitive-data, software-supply-chain, malware, or all.
        required: false
        type: string
        default: all
      pull_image:
        description: Pull the image before scanning.
        required: false
        type: boolean
        default: true
      dockerfile:
        description: Repository-relative Dockerfile path.
        required: false
        type: string
        default: Dockerfile
      policies:
        description: Optional comma-separated exact Wiz CI/CD policy names. Overrides policy_profile and automatic branch selection.
        required: false
        type: string
        default: ""
      policy_profile:
        description: Policy profile to use (auto, staging, or production). Auto uses production for main/production and PRs targeting them; all other branches use staging.
        required: false
        type: string
        default: auto
      projects:
        description: Optional comma-separated Wiz project IDs or supported slugs.
        required: false
        type: string
        default: ""
      applications:
        description: Optional comma-separated Wiz code application environments.
        required: false
        type: string
        default: ""
      registry:
        description: Optional container registry hostname for docker login.
        required: false
        type: string
        default: ""
      registry_username:
        description: Optional private-registry username.
        required: false
        type: string
        default: ""
      publish:
        description: Publish the scan to Wiz Code & Build Scans.
        required: false
        type: boolean
        default: true
      fail_on_policy:
        description: Fail the job when Wiz CLI returns policy failure exit code 4.
        required: false
        type: boolean
        default: true
      policy_hits:
        description: Findings to include in reports (BLOCK, AUDIT, or DISABLED for all findings).
        required: false
        type: string
        default: DISABLED
      artifact_retention_days:
        description: Number of days to retain GitHub scan-report artifacts.
        required: false
        type: number
        default: 14
    secrets:
      WIZ_CLIENT_ID:
        description: Wiz CLI CI/CD service-account client ID.
        required: true
      WIZ_CLIENT_SECRET:
        description: Wiz CLI CI/CD service-account client secret.
        required: true
      REGISTRY_PASSWORD:
        description: Optional private-registry password or token.
        required: false
    outputs:
      artifact_name:
        description: Name of the uploaded GitHub artifact.
        value: ${{ jobs.scan.outputs.artifact_name }}
      artifact_url:
        description: URL of the uploaded GitHub artifact.
        value: ${{ jobs.scan.outputs.artifact_url }}
      wizcli_exit_code:
        description: Original Wiz CLI exit code.
        value: ${{ jobs.scan.outputs.wizcli_exit_code }}
      trusted_image_tagged:
        description: Whether wizcli tag successfully added the image to the Wiz Trusted Image Database.
        value: ${{ jobs.scan.outputs.trusted_image_tagged }}

permissions:
  contents: read

jobs:
  scan:
    name: Container-image scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ format('wiz-image-{0}-{1}-{2}', github.repository_id, github.run_id, github.run_attempt) }}
      artifact_url: ${{ steps.artifact.outputs.artifact-url }}
      wizcli_exit_code: ${{ steps.wiz_scan.outputs.exit_code }}
      trusted_image_tagged: ${{ steps.wiz_tag.outputs.tagged || 'false' }}
    env:
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      INPUT_IMAGE: ${{ inputs.image }}
      INPUT_TAG_IMAGE: ${{ inputs.tag_image }}
      INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
      INPUT_SCAN_TYPES: ${{ inputs.scan_types }}
      INPUT_PULL_IMAGE: ${{ inputs.pull_image }}
      INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
      INPUT_POLICIES: ${{ inputs.policies }}
      INPUT_POLICY_PROFILE: ${{ inputs.policy_profile }}
      INPUT_PROJECTS: ${{ inputs.projects }}
      INPUT_APPLICATIONS: ${{ inputs.applications }}
      INPUT_REGISTRY: ${{ inputs.registry }}
      INPUT_REGISTRY_USERNAME: ${{ inputs.registry_username }}
      INPUT_PUBLISH: ${{ inputs.publish }}
      INPUT_POLICY_HITS: ${{ inputs.policy_hits }}
      REPORT_DIR: /tmp/wiz-image-reports
      WIZCLI_PATH: /tmp/wizcli
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          case "${INPUT_POLICY_HITS^^}" in
            BLOCK|AUDIT|DISABLED) ;;
            *) echo "policy_hits must be BLOCK, AUDIT, or DISABLED" >&2; exit 2 ;;
          esac
          case "${INPUT_POLICY_PROFILE,,}" in
            auto|staging|production) ;;
            *) echo "policy_profile must be auto, staging, or production" >&2; exit 2 ;;
          esac
          if [[ "$INPUT_TAG_IMAGE" == "true" && "$INPUT_PUBLISH" != "true" ]]; then
            echo "tag_image requires publish=true because Wiz can trust only a published successful scan" >&2
            exit 2
          fi
          if [[ -n "$INPUT_IMAGE_DIGEST" && "$INPUT_TAG_IMAGE" != "true" ]]; then
            echo "image_digest is only used when tag_image=true" >&2
            exit 2
          fi
          if [[ "$INPUT_TAG_IMAGE" == "true" ]]; then
            case "$INPUT_IMAGE" in
              *.tar|*.tar.gz|*.tgz)
                [[ -n "$INPUT_IMAGE_DIGEST" ]] || {
                  echo "image_digest is required to tag an exported image archive" >&2
                  exit 2
                }
                ;;
            esac
          fi
          if [[ -n "$INPUT_REGISTRY" || -n "$INPUT_REGISTRY_USERNAME" || -n "$REGISTRY_PASSWORD" ]]; then
            [[ -n "$INPUT_REGISTRY" && -n "$INPUT_REGISTRY_USERNAME" && -n "$REGISTRY_PASSWORD" ]] || {
              echo "registry, registry_username, and REGISTRY_PASSWORD must be supplied together" >&2
              exit 2
            }
          fi
          if (( ${{ inputs.artifact_retention_days }} < 1 || ${{ inputs.artifact_retention_days }} > 90 )); then
            echo "artifact_retention_days must be between 1 and 90" >&2
            exit 2
          fi

      - name: Download Wiz CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$WIZCLI_PATH" \
            "https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64"
          chmod 0755 "$WIZCLI_PATH"
          "$WIZCLI_PATH" version

      - name: Log in to container registry
        if: ${{ inputs.registry != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$INPUT_REGISTRY" \
            --username "$INPUT_REGISTRY_USERNAME" --password-stdin

      - name: Pull image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INPUT_PULL_IMAGE" == "true" && ! -f "$INPUT_IMAGE" ]]; then
            docker pull "$INPUT_IMAGE"
          fi

      - name: Prepare artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          "$WIZCLI_PATH" version > "$REPORT_DIR/wizcli-version.txt"
          {
            echo "target=container-image"
            echo "image=$INPUT_IMAGE"
            echo "tag_image=$INPUT_TAG_IMAGE"
            echo "image_digest=${INPUT_IMAGE_DIGEST:-auto-resolve}"
            echo "scan_types=$INPUT_SCAN_TYPES"
            echo "repository=$GITHUB_REPOSITORY"
            echo "sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } > "$REPORT_DIR/scan-metadata.txt"

      - name: Run Wiz CLI container-image scan
        id: wiz_scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          normalized="${INPUT_SCAN_TYPES,,}"
          normalized="${normalized// /}"
          [[ -n "$normalized" ]] || { echo "scan_types cannot be empty" >&2; exit 2; }

          declare -A selected=()
          IFS=',' read -r -a requested <<< "$normalized"
          for scan_type in "${requested[@]}"; do
            case "$scan_type" in
              all)
                if (( ${#requested[@]} != 1 )); then
                  echo "Use scan_types=all by itself" >&2
                  exit 2
                fi
                for item in vulnerabilities secrets sensitive-data software-supply-chain malware; do
                  selected["$item"]=1
                done
                ;;
              vulnerability|vulnerabilities) selected[vulnerabilities]=1 ;;
              secret|secrets) selected[secrets]=1 ;;
              data|sensitive-data|sensitive_data) selected[sensitive-data]=1 ;;
              supply-chain|software-supply-chain|software_supply_chain) selected[software-supply-chain]=1 ;;
              malware) selected[malware]=1 ;;
              *) echo "Unsupported image scan type: $scan_type" >&2; exit 2 ;;
            esac
          done

          cmd=("$WIZCLI_PATH" scan container-image "$INPUT_IMAGE")
          cmd+=(--name "github:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}")
          cmd+=(--scan-context-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}")
          cmd+=(--tags "github/repository=${GITHUB_REPOSITORY}")
          cmd+=(--tags "github/run-id=${GITHUB_RUN_ID}")
          cmd+=(--tags "github/sha=${GITHUB_SHA}")
          cmd+=(--by-policy-hits "${INPUT_POLICY_HITS^^}")
          cmd+=(--no-color --no-style)
          cmd+=(--human-output-file "$REPORT_DIR/report.txt")
          cmd+=(--json-output-file "$REPORT_DIR/report.json")
          cmd+=(--sarif-output-file "$REPORT_DIR/report.sarif")

          [[ -f "$INPUT_DOCKERFILE" ]] && cmd+=(--dockerfile "$INPUT_DOCKERFILE")
          [[ -n "$INPUT_PROJECTS" ]] && cmd+=(--projects "$INPUT_PROJECTS")
          [[ -n "$INPUT_APPLICATIONS" ]] && cmd+=(--applications "$INPUT_APPLICATIONS")
          [[ "$INPUT_PUBLISH" == "false" ]] && cmd+=(--no-publish)

          if [[ "$normalized" != "all" ]]; then
            disabled=()
            [[ -z "${selected[vulnerabilities]:-}" ]] && disabled+=(Vulnerability)
            [[ -z "${selected[secrets]:-}" ]] && disabled+=(Secret)
            [[ -z "${selected[sensitive-data]:-}" ]] && disabled+=(SensitiveData)
            [[ -z "${selected[software-supply-chain]:-}" ]] && disabled+=(SoftwareSupplyChain)
            [[ -z "${selected[malware]:-}" ]] && disabled+=(Malware)
            disabled_csv=$(IFS=,; echo "${disabled[*]}")
            cmd+=(--disabled-scanners "$disabled_csv")
          fi

          effective_branch="${GITHUB_BASE_REF:-${GITHUB_REF_NAME:-unknown}}"
          requested_profile="${INPUT_POLICY_PROFILE,,}"
          if [[ -n "$INPUT_POLICIES" ]]; then
            effective_profile=custom
            policy_csv="$INPUT_POLICIES"
          else
            if [[ "$requested_profile" == "auto" ]]; then
              case "$effective_branch" in
                main|production) effective_profile=production ;;
                *) effective_profile=staging ;;
              esac
            else
              effective_profile="$requested_profile"
            fi

            case "$effective_profile" in
              production) policy_suffix=prod ;;
              staging) policy_suffix=staging ;;
            esac

            policies=()
            [[ -n "${selected[vulnerabilities]:-}" ]] && policies+=("alfortes-vulnerabilities-$policy_suffix")
            [[ -n "${selected[secrets]:-}" ]] && policies+=("alfortes-secrets-$policy_suffix")
            [[ -n "${selected[sensitive-data]:-}" ]] && policies+=("alfortes-sensitive-data-$policy_suffix")
            [[ -n "${selected[software-supply-chain]:-}" ]] && policies+=("alfortes-software-supply-chain-$policy_suffix")
            [[ -n "${selected[malware]:-}" ]] && policies+=("alfortes-malware-$policy_suffix")
            policy_csv=$(IFS=,; echo "${policies[*]}")
          fi
          cmd+=(--policies "$policy_csv")

          {
            echo "effective_branch=$effective_branch"
            echo "policy_profile=$effective_profile"
            echo "policies=$policy_csv"
          } >> "$REPORT_DIR/scan-metadata.txt"

          set +e
          "${cmd[@]}" 2>&1 | tee "$REPORT_DIR/wizcli.log"
          scan_rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$scan_rc" >> "$GITHUB_OUTPUT"
          {
            echo "## Wiz CLI container-image scan"
            echo
            echo "- Scan types: \`$INPUT_SCAN_TYPES\`"
            echo "- Image: \`$INPUT_IMAGE\`"
            echo "- Effective branch: \`$effective_branch\`"
            echo "- Policy profile: \`$effective_profile\`"
            echo "- Policies: \`$policy_csv\`"
            echo "- Wiz CLI exit code: \`$scan_rc\`"
            echo "- Results published to Wiz: \`$INPUT_PUBLISH\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$scan_rc"

      - name: Add image to Wiz Trusted Image Database
        id: wiz_tag
        if: ${{ inputs.tag_image && steps.wiz_scan.outputs.exit_code == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          cmd=("$WIZCLI_PATH" tag "$INPUT_IMAGE" --no-color --no-style)
          [[ -n "$INPUT_IMAGE_DIGEST" ]] && cmd+=(--digest "$INPUT_IMAGE_DIGEST")
          [[ -n "$INPUT_PROJECTS" ]] && cmd+=(--projects "$INPUT_PROJECTS")

          "${cmd[@]}" 2>&1 | tee "$REPORT_DIR/wizcli-tag.log"
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "### Wiz Trusted Image Database"
            echo
            echo "- Image added with \`wizcli tag\`: \`$INPUT_IMAGE\`"
            echo "- Digest: \`${INPUT_IMAGE_DIGEST:-resolved from the local image}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Wiz CLI reports
        id: artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('wiz-image-{0}-{1}-{2}', github.repository_id, github.run_id, github.run_attempt) }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Log out of container registry
        if: ${{ always() && inputs.registry != '' }}
        shell: bash
        run: docker logout "$INPUT_REGISTRY"

      - name: Enforce Wiz CLI result
        if: always()
        shell: bash
        env:
          SCAN_EXIT_CODE: ${{ steps.wiz_scan.outputs.exit_code }}
          FAIL_ON_POLICY: ${{ inputs.fail_on_policy }}
        run: |
          set -euo pipefail
          scan_rc="${SCAN_EXIT_CODE:-1}"
          if [[ "$scan_rc" == "0" ]]; then
            exit 0
          fi
          if [[ "$scan_rc" == "4" && "$FAIL_ON_POLICY" == "false" ]]; then
            echo "Wiz policy failure was configured as non-blocking."
            exit 0
          fi
          exit "$scan_rc"
